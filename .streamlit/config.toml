[server]
# Hard server-side ceiling for file_uploader (Tornado request-body limit). Must be >= ROBOTRACE_MAX_UPLOAD_MB
# or uploads above this value are rejected by Streamlit itself before the app ever sees them. Override
# without editing this file via the STREAMLIT_SERVER_MAX_UPLOAD_SIZE environment variable.
maxUploadSize = 500
enableXsrfProtection = true
headless = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#0e7490"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f1f5f9"
textColor = "#0f172a"
font = "sans serif"
